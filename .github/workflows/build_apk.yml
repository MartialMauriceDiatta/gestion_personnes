name: Build Flutter APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Generate Android project structure
        run: flutter create . --project-name bransan --platforms=android

      # Nom de l'application affiché sur le téléphone
      - name: Set app name to bransan
        run: sed -i 's/android:label="[^"]*"/android:label="bransan"/' android/app/src/main/AndroidManifest.xml

      # Forcer compileSdk 36 sur TOUS les modules (app + plugins)
      - name: Force compileSdk 36 on all modules
        run: |
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties

          if [ -f android/build.gradle.kts ]; then
            cat >> android/build.gradle.kts << 'EOF'

          subprojects {
              val forceSdk: Project.() -> Unit = {
                  (extensions.findByName("android") as? com.android.build.gradle.BaseExtension)
                      ?.compileSdkVersion(36)
              }
              if (state.executed) forceSdk() else afterEvaluate { forceSdk() }
          }
          EOF
          else
            cat >> android/build.gradle << 'EOF'

          subprojects {
              def forceSdk = { Project p ->
                  if (p.hasProperty('android')) {
                      p.android.compileSdkVersion 36
                  }
              }
              if (project.state.executed) {
                  forceSdk(project)
              } else {
                  project.afterEvaluate { forceSdk(it) }
              }
          }
          EOF
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bransan-APK
          path: build/app/outputs/flutter-apk/app-release.apk