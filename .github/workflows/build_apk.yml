name: Build Flutter APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # 1. Configurer Java 17
      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      # 2. Configurer Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      # 3. Créer le projet natif Android
      - name: Generate Android project structure
        run: flutter create . --project-name bransan --platforms=android

      # 4. Forcer le compileSdk à 36 pour TOUS les modules (app + plugins comme file_picker)
      - name: Force compileSdk 36 globally
        run: |
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          EOF

      # 5. Installer les dépendances
      - name: Install dependencies
        run: flutter pub get

      # 6. Compiler l'APK Release
      - name: Build APK
        run: flutter build apk --release

      # 7. Télécharger l'APK généré
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Transport-Bransan-APK
          path: build/app/outputs/flutter-apk/app-release.apk